[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-etl"
version = "0.1.0"
description = "Normalize messy lab CSV exports (instrument preambles, units in headers, plate-reader grids) into tidy, analysis-ready tables"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sri Gorantla" }]
keywords = ["lims", "laboratory-informatics", "etl", "data-cleaning", "plate-reader"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
lims-etl = "lims_etl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
